name: my_music_stream
description: A Spotify-like music streaming application with offline functionality.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  provider: ^6.0.5
  shared_preferences: ^2.1.1
  just_audio: ^0.9.34
  connectivity_plus: ^4.0.1
  path_provider: ^2.0.15
  flutter_svg: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/data/
    - assets/images/
    - assets/audio/

  # Commenting out fonts until we have the actual font files
